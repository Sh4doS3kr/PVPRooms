name: PvPRoomsPro
version: '1.0.0'
main: com.pvprooms.PvPRoomsPro
api-version: '1.21'
description: Professional PvP duels plugin with ELO, GUI kits, and auto arena instancing
authors: [PvPRoomsPro]
website: https://github.com/pvproomspro

commands:
  kit:
    description: Kit management command
    usage: /kit <create|delete|edit> <name>
    permission: pvprooms.kit
  arena:
    description: Arena management command
    usage: /arena <create|setspawn1|setspawn2|delete> <name>
    permission: pvprooms.arena
  queue:
    description: Join the PvP queue
    usage: /queue
    permission: pvprooms.queue
  spectate:
    description: Spectate an active duel
    usage: /spectate <player>
    permission: pvprooms.spectate
  pvpleave:
    description: Leave the queue or current duel
    usage: /pvpleave
    permission: pvprooms.leave
  stats:
    description: View your ELO stats
    usage: /stats [player]
    permission: pvprooms.stats
  top:
    description: Ver el ranking ELO
    usage: /top
    permission: pvprooms.top
  setspawn:
    description: Establece el spawn del lobby en tu posición actual
    usage: /setspawn
    permission: pvprooms.admin
  setspawnworld:
    description: Establece el mundo del lobby al mundo actual
    usage: /setspawnworld
    permission: pvprooms.admin
  spawn:
    description: Teletransportarse al spawn del lobby
    usage: /spawn
    permission: pvprooms.spawn
  admin:
    description: Comandos de administración del plugin
    usage: /admin <elo|kick|forceend|reload|info>
    permission: pvprooms.admin
  adminpanel:
    description: Abre el panel gráfico de administración
    usage: /adminpanel
    permission: pvprooms.admin
  trim:
    description: Gestiona tus trims de armadura personales
    usage: /trim [gui|clear [piece]|give <crate|key|legendary> [player]]
    permission: pvprooms.trim
  kittrim:
    description: Configura los trims por defecto de un kit (admin)
    usage: /kittrim <kit> [gui]
    permission: pvprooms.kittrim
  npc:
    description: Crear y gestionar NPCs interactivos
    usage: /npc <create|name|move|delete|list> ...
    permission: pvprooms.admin
  holo:
    description: Crear y gestionar hologramas
    usage: /holo <create|custom|addline|setline|delline|move|delete|list> ...
    permission: pvprooms.admin

permissions:
  pvprooms.kit:
    description: Access /kit commands (admin only)
    default: op
  pvprooms.arena:
    description: Access /arena commands (admin only)
    default: op
  pvprooms.queue:
    description: Join the PvP queue
    default: true
  pvprooms.spectate:
    description: Spectate active duels
    default: true
  pvprooms.leave:
    description: Leave queue or duel
    default: true
  pvprooms.stats:
    description: View ELO stats
    default: true
  pvprooms.top:
    description: View ELO leaderboard
    default: true
  pvprooms.spawn:
    description: Usar /spawn para ir al lobby
    default: true
  pvprooms.trim:
    description: Usar /trim para gestionar trims personales
    default: true
  pvprooms.kittrim:
    description: Usar /kittrim para configurar trims de kit (admin)
    default: op
  pvprooms.admin:
    description: Full admin access
    default: op
    children:
      pvprooms.kit: true
      pvprooms.arena: true
      pvprooms.kittrim: true
