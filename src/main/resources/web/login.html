<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Moon Tiers — Iniciar Sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<style>
.auth-container {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  background: radial-gradient(ellipse at 50% 0%, rgba(99,76,255,.08) 0%, transparent 60%);
}

.auth-card {
  background: linear-gradient(135deg, rgba(15,17,23,.95) 0%, rgba(20,22,30,.98) 100%);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 3rem;
  width: 100%;
  max-width: 440px;
  box-shadow: 0 25px 80px rgba(0,0,0,.5), 0 0 100px rgba(99,76,255,.05);
  position: relative;
  overflow: hidden;
}

.auth-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent2), #ec4899);
}

.auth-logo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .6rem;
  margin-bottom: .5rem;
  font-family: 'Geist Mono', monospace;
  font-size: 1.5rem;
  font-weight: 800;
}

.auth-logo img {
  width: 32px;
  height: 32px;
  image-rendering: pixelated;
}

.auth-subtitle {
  text-align: center;
  color: var(--sub);
  margin-bottom: 2rem;
  font-size: .9rem;
}

/* Steps */
.step { display: none; animation: fadeIn .3s ease; }
.step.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.form-group { margin-bottom: 1.5rem; }

.form-label {
  display: block;
  color: var(--sub);
  font-size: .85rem;
  font-weight: 500;
  margin-bottom: .5rem;
}

.form-input {
  width: 100%;
  padding: 1rem 1.25rem;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border2);
  border-radius: 12px;
  color: var(--text);
  font-family: inherit;
  font-size: 1rem;
  transition: all .2s ease;
}

.form-input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(99,76,255,.15);
}

.form-input::placeholder { color: var(--muted); }

.form-hint {
  margin-top: .5rem;
  font-size: .8rem;
  color: var(--muted);
}

.btn-primary {
  width: 100%;
  padding: 1rem 1.5rem;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  border: none;
  border-radius: 12px;
  color: white;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .5rem;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(99,76,255,.3);
}

.btn-primary:disabled {
  opacity: .6;
  cursor: not-allowed;
  transform: none;
}

.btn-primary svg { width: 18px; height: 18px; }

.btn-secondary {
  width: 100%;
  padding: 1rem 1.5rem;
  background: rgba(255,255,255,.05);
  border: 1px solid var(--border2);
  border-radius: 12px;
  color: var(--text);
  font-family: inherit;
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  transition: all .2s;
  margin-top: .75rem;
}

.btn-secondary:hover {
  background: rgba(255,255,255,.08);
  border-color: var(--accent);
}

/* Code Box */
.code-box {
  background: linear-gradient(135deg, rgba(34,197,94,.08) 0%, rgba(34,197,94,.03) 100%);
  border: 1px solid rgba(34,197,94,.25);
  border-radius: 16px;
  padding: 2rem;
  text-align: center;
  margin-bottom: 1.5rem;
}

.code-title {
  color: #86efac;
  font-weight: 600;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  font-size: 1.1rem;
}

.code-title svg { width: 22px; height: 22px; }

.code-display {
  font-family: 'Geist Mono', monospace;
  font-size: 1.5rem;
  font-weight: 700;
  color: white;
  background: rgba(0,0,0,.3);
  padding: .75rem 1.25rem;
  border-radius: 10px;
  letter-spacing: 3px;
  margin-bottom: 1rem;
  display: inline-block;
}

.code-instructions {
  font-size: .9rem;
  color: var(--sub);
  line-height: 1.7;
}

.code-instructions code {
  background: rgba(251,191,36,.15);
  color: #fbbf24;
  padding: .3rem .6rem;
  border-radius: 6px;
  font-family: 'Geist Mono', monospace;
  font-size: .95rem;
}

.code-timer {
  margin-top: 1rem;
  font-size: .8rem;
  color: var(--muted);
}

.code-timer strong { color: #f59e0b; }

/* Alert */
.alert {
  padding: 1rem 1.25rem;
  border-radius: 12px;
  margin-bottom: 1.5rem;
  font-size: .9rem;
  display: none;
  align-items: center;
  gap: .75rem;
}

.alert.show { display: flex; animation: fadeIn .3s ease; }

.alert-error {
  background: rgba(239,68,68,.1);
  border: 1px solid rgba(239,68,68,.25);
  color: #fca5a5;
}

.alert-success {
  background: rgba(34,197,94,.1);
  border: 1px solid rgba(34,197,94,.25);
  color: #86efac;
}

.alert svg { width: 18px; height: 18px; flex-shrink: 0; }

/* Back Link */
.auth-back {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  margin-top: 2rem;
  color: var(--muted);
  font-size: .9rem;
  text-decoration: none;
  transition: color .2s;
}

.auth-back:hover { color: var(--text); }
.auth-back svg { width: 16px; height: 16px; }

/* Spinner */
.spinner {
  width: 18px;
  height: 18px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.21.4/assets/minecraft/textures/item/nether_star.png" alt=""/>
      Moon<span style="color:var(--accent2)">·</span>Tiers
    </div>
    <p class="auth-subtitle">Sistema de Tickets para Tiers</p>

    <!-- STEP 1: Enter Username -->
    <div class="step active" id="step1">
      <div id="alert1" class="alert"></div>
      
      <div class="form-group">
        <label class="form-label">Nombre de Minecraft</label>
        <input type="text" class="form-input" id="username" placeholder="Tu nombre exacto en el servidor" autocomplete="username"/>
        <p class="form-hint">Debes haber jugado al menos una vez en el servidor.</p>
      </div>

      <button class="btn-primary" id="btnGetCode" onclick="getCode()">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
        Obtener Código de Verificación
      </button>
    </div>

    <!-- STEP 2: Show Code -->
    <div class="step" id="step2">
      <div id="alert2" class="alert"></div>
      
      <div class="code-box">
        <div class="code-title">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
          Tu Código de Verificación
        </div>
        <div class="code-display" id="codeDisplay">000000000</div>
        <div class="code-instructions">
          Abre <strong>Minecraft</strong> y escribe:<br>
          <code>/verificar <span id="codeCmd">000000000</span></code>
        </div>
        <div class="code-timer">El código expira en <strong>10 minutos</strong></div>
      </div>

      <button class="btn-primary" id="btnVerified" onclick="checkVerified()">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        Ya verifiqué, entrar
      </button>
      
      <button class="btn-secondary" onclick="goBack()">
        ← Volver a introducir nombre
      </button>
    </div>

    <a href="/" class="auth-back">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      Volver a clasificaciones
    </a>
  </div>
</div>

<script>
const API_BASE = '';
let currentUsername = '';
let currentCode = '';

function showAlert(num, type, msg) {
  const alert = document.getElementById('alert' + num);
  alert.className = 'alert show alert-' + type;
  alert.innerHTML = type === 'error'
    ? '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' + msg
    : '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' + msg;
}

function hideAlerts() {
  document.querySelectorAll('.alert').forEach(a => a.classList.remove('show'));
}

function showStep(num) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('step' + num).classList.add('active');
  hideAlerts();
}

function goBack() {
  showStep(1);
}

async function getCode() {
  const username = document.getElementById('username').value.trim();
  if (!username) {
    showAlert(1, 'error', 'Introduce tu nombre de Minecraft');
    return;
  }

  const btn = document.getElementById('btnGetCode');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Generando...';

  try {
    const res = await fetch(API_BASE + '/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username })
    });
    const data = await res.json();

    if (data.success && data.code) {
      currentUsername = username;
      currentCode = data.code;
      document.getElementById('codeDisplay').textContent = data.code;
      document.getElementById('codeCmd').textContent = data.code;
      showStep(2);
    } else {
      showAlert(1, 'error', data.message || 'Error al generar código');
    }
  } catch (err) {
    showAlert(1, 'error', 'Error de conexión');
  }

  btn.disabled = false;
  btn.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg> Obtener Código de Verificación';
}

async function checkVerified() {
  const btn = document.getElementById('btnVerified');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Verificando...';

  try {
    const res = await fetch(API_BASE + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: currentUsername })
    });
    const data = await res.json();

    if (data.success) {
      localStorage.setItem('auth_token', data.token);
      localStorage.setItem('auth_user', JSON.stringify({
        username: data.username,
        uuid: data.uuid,
        role: data.role
      }));
      showAlert(2, 'success', '¡Bienvenido ' + data.username + '!');
      setTimeout(() => {
        window.location.href = data.role === 'user' ? '/tickets.html' : '/admin.html';
      }, 1000);
    } else {
      showAlert(2, 'error', data.message || 'Aún no has verificado. Usa /verificar ' + currentCode + ' en Minecraft.');
    }
  } catch (err) {
    showAlert(2, 'error', 'Error de conexión');
  }

  btn.disabled = false;
  btn.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Ya verifiqué, entrar';
}

// Check if already logged in
const token = localStorage.getItem('auth_token');
if (token) {
  fetch(API_BASE + '/api/auth/session', {
    headers: { 'Authorization': 'Bearer ' + token }
  })
  .then(r => r.json())
  .then(data => {
    if (data.valid) {
      window.location.href = data.role === 'user' ? '/tickets.html' : '/admin.html';
    }
  });
}

// Enter key support
document.getElementById('username').addEventListener('keypress', e => {
  if (e.key === 'Enter') getCode();
});
</script>

</body>
</html>
