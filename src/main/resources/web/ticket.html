<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Moon Tiers — Ticket</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<style>
.page-container { min-height: 100vh; padding-top: 80px; }

.page-header {
  position: fixed; top: 0; left: 0; right: 0; height: 60px;
  background: rgba(10,10,15,.95); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 2rem; z-index: 100; gap: 1rem;
}

.back-btn {
  display: flex; align-items: center; gap: .4rem;
  color: var(--muted); font-size: .85rem; text-decoration: none;
  padding: .5rem .8rem; border-radius: 8px; transition: all .2s ease;
}
.back-btn:hover { color: var(--text); background: rgba(255,255,255,.05); }
.back-btn svg { width: 16px; height: 16px; }

.header-title { font-size: 1rem; font-weight: 600; color: var(--text); }

.main-content { max-width: 900px; margin: 0 auto; padding: 2rem; }

.ticket-header {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 1.5rem; margin-bottom: 1.5rem;
}

.ticket-top-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1rem; flex-wrap: wrap; gap: .5rem;
}

.ticket-id-big {
  font-family: 'Geist Mono', monospace; font-size: .85rem; color: var(--muted);
}

.ticket-status {
  font-size: .75rem; font-weight: 600; padding: .3rem .7rem;
  border-radius: 8px; text-transform: uppercase;
}
.ticket-status.pending { background: rgba(234,179,8,.15); color: #fbbf24; }
.ticket-status.scheduled { background: rgba(59,130,246,.15); color: #60a5fa; }
.ticket-status.in_progress { background: rgba(168,85,247,.15); color: #c084fc; }
.ticket-status.completed { background: rgba(34,197,94,.15); color: #4ade80; }
.ticket-status.rejected { background: rgba(239,68,68,.15); color: #f87171; }

.ticket-main-info {
  display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
}

.info-item { display: flex; flex-direction: column; gap: .2rem; }
.info-label { font-size: .7rem; color: var(--muted); text-transform: uppercase; }
.info-value { font-size: 1rem; font-weight: 600; color: var(--text); }
.info-value.tier { color: var(--accent2); }

.ticket-meta {
  display: flex; gap: 2rem; margin-top: 1rem; padding-top: 1rem;
  border-top: 1px solid var(--border); flex-wrap: wrap;
}

.meta-item { font-size: .8rem; color: var(--muted); }
.meta-item strong { color: var(--sub); }

.schedule-box {
  background: rgba(59,130,246,.1); border: 1px solid rgba(59,130,246,.3);
  border-radius: 10px; padding: 1rem; margin-top: 1rem;
}

.schedule-title { font-size: .85rem; font-weight: 600; color: #60a5fa; margin-bottom: .5rem; }
.schedule-time { font-size: 1rem; color: var(--text); }

.result-box {
  border-radius: 10px; padding: 1rem; margin-top: 1rem;
}
.result-box.approved {
  background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.3);
}
.result-box.denied {
  background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3);
}
.result-title { font-size: .85rem; font-weight: 600; margin-bottom: .3rem; }
.result-box.approved .result-title { color: #4ade80; }
.result-box.denied .result-title { color: #f87171; }
.result-text { font-size: .9rem; color: var(--sub); }

/* Chat Section */
.chat-section {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  overflow: hidden; display: flex; flex-direction: column; height: 500px;
}

.chat-header {
  padding: 1rem 1.5rem; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}

.chat-title { font-size: 1rem; font-weight: 600; }

.chat-messages {
  flex: 1; overflow-y: auto; padding: 1rem 1.5rem;
  display: flex; flex-direction: column; gap: .8rem;
}

.message {
  max-width: 80%; padding: .8rem 1rem; border-radius: 12px;
}

.message.user {
  align-self: flex-end;
  background: var(--accent);
  color: white;
  border-bottom-right-radius: 4px;
}

.message.tester, .message.admin {
  align-self: flex-start;
  background: rgba(255,255,255,.08);
  border-bottom-left-radius: 4px;
}

.message-sender {
  font-size: .7rem; font-weight: 600; margin-bottom: .3rem; opacity: .8;
}

.message-text { font-size: .9rem; line-height: 1.4; }

.message-time {
  font-size: .65rem; opacity: .6; margin-top: .3rem; text-align: right;
}

.chat-empty {
  flex: 1; display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: .9rem;
}

.chat-input-area {
  padding: 1rem 1.5rem; border-top: 1px solid var(--border);
  display: flex; gap: .8rem;
}

.chat-input {
  flex: 1; background: rgba(255,255,255,.05); border: 1px solid var(--border2);
  border-radius: 10px; padding: .8rem 1rem; font-family: inherit;
  font-size: .9rem; color: var(--text); outline: none; resize: none;
}

.chat-input:focus { border-color: var(--accent); }

.chat-send {
  background: var(--accent); border: none; border-radius: 10px;
  padding: 0 1.2rem; cursor: pointer; transition: all .2s ease;
}

.chat-send:hover { background: var(--accent2); }
.chat-send svg { width: 18px; height: 18px; color: white; }

/* Admin/Tester Actions */
.actions-section {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 1.5rem; margin-bottom: 1.5rem;
}

.actions-title {
  font-size: 1rem; font-weight: 600; margin-bottom: 1rem;
  display: flex; align-items: center; gap: .5rem;
}

.actions-grid { display: flex; flex-direction: column; gap: 1rem; }

.action-row { display: flex; gap: 1rem; flex-wrap: wrap; }

.action-btn {
  padding: .7rem 1.2rem; border-radius: 10px; font-family: inherit;
  font-size: .85rem; font-weight: 500; cursor: pointer; border: none;
  transition: all .2s ease;
}

.action-btn.primary {
  background: var(--accent); color: white;
}
.action-btn.primary:hover { background: var(--accent2); }

.action-btn.success {
  background: rgba(34,197,94,.15); color: #4ade80; border: 1px solid rgba(34,197,94,.3);
}
.action-btn.success:hover { background: rgba(34,197,94,.25); }

.action-btn.danger {
  background: rgba(239,68,68,.15); color: #f87171; border: 1px solid rgba(239,68,68,.3);
}
.action-btn.danger:hover { background: rgba(239,68,68,.25); }

.form-inline { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }

.form-inline select, .form-inline input {
  background: rgba(255,255,255,.05); border: 1px solid var(--border2);
  border-radius: 8px; padding: .6rem .8rem; font-family: inherit;
  font-size: .85rem; color: var(--text);
}

.admin-only, .tester-only { display: none; }
body.role-admin .admin-only { display: flex; }
body.role-tester .tester-only { display: flex; }
body.role-admin .tester-only { display: flex; }

@media (max-width: 600px) {
  .main-content { padding: 1rem; }
  .chat-section { height: 400px; }
  .message { max-width: 90%; }
}
</style>
</head>
<body>

<header class="page-header">
  <a href="/tickets.html" class="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Volver
  </a>
  <span class="header-title" id="headerTitle">Cargando...</span>
</header>

<div class="page-container">
  <div class="main-content">
    <!-- Ticket Header -->
    <div class="ticket-header" id="ticketHeader">
      <div class="ticket-top-row">
        <span class="ticket-id-big" id="ticketId"></span>
        <span class="ticket-status" id="ticketStatus"></span>
      </div>
      <div class="ticket-main-info">
        <div class="info-item">
          <span class="info-label">Usuario</span>
          <span class="info-value" id="ticketUser"></span>
        </div>
        <div class="info-item">
          <span class="info-label">Kit</span>
          <span class="info-value" id="ticketKit"></span>
        </div>
        <div class="info-item">
          <span class="info-label">Tier Objetivo</span>
          <span class="info-value tier" id="ticketTier"></span>
        </div>
      </div>
      <div class="ticket-meta">
        <div class="meta-item">Creado: <strong id="ticketCreated"></strong></div>
        <div class="meta-item">Tester: <strong id="ticketTester">Sin asignar</strong></div>
      </div>
      <div class="schedule-box" id="scheduleBox" style="display:none">
        <div class="schedule-title">📅 Test Programado</div>
        <div class="schedule-time" id="scheduleTime"></div>
      </div>
      <div class="result-box" id="resultBox" style="display:none">
        <div class="result-title" id="resultTitle"></div>
        <div class="result-text" id="resultText"></div>
      </div>
    </div>

    <!-- Admin/Tester Actions -->
    <div class="actions-section admin-only tester-only" id="actionsSection">
      <div class="actions-title">⚙️ Acciones</div>
      <div class="actions-grid">
        <div class="action-row" id="assignRow">
          <div class="form-inline">
            <select id="testerSelect">
              <option value="420Sleeptyx">420Sleeptyx</option>
            </select>
            <button class="action-btn primary" onclick="assignTester()">Asignar Tester</button>
          </div>
        </div>
        <div class="action-row" id="scheduleRow">
          <div class="form-inline">
            <input type="date" id="scheduleDate"/>
            <select id="scheduleTime">
              <option value="16:00">16:00 - 17:00</option>
              <option value="17:00">17:00 - 18:00</option>
              <option value="18:00">18:00 - 19:00</option>
              <option value="19:00">19:00 - 20:00</option>
              <option value="20:00">20:00 - 21:00</option>
              <option value="21:00">21:00 - 22:00</option>
            </select>
            <button class="action-btn primary" onclick="scheduleTest()">Programar Test</button>
          </div>
        </div>
        <div class="action-row" id="completeRow">
          <div class="form-inline">
            <select id="newTierSelect">
              <option value="HT3">HT3</option>
              <option value="HT2">HT2</option>
              <option value="HT1">HT1</option>
              <option value="LT5">LT5</option>
            </select>
            <button class="action-btn success" onclick="completeTicket('approved')">✓ Aprobar</button>
            <button class="action-btn danger" onclick="completeTicket('denied')">✗ Rechazar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Chat Section -->
    <div class="chat-section">
      <div class="chat-header">
        <span class="chat-title">💬 Chat del Ticket</span>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-empty">Inicia la conversación...</div>
      </div>
      <div class="chat-input-area">
        <textarea class="chat-input" id="messageInput" placeholder="Escribe un mensaje..." rows="1"></textarea>
        <button class="chat-send" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
const API_BASE = '';
let currentUser = null;
let ticketData = null;
let ticketId = new URLSearchParams(window.location.search).get('id');

async function checkAuth() {
  const session = localStorage.getItem('session');
  if (!session) { window.location.href = '/login.html'; return; }

  try {
    const res = await fetch(API_BASE + '/api/auth/me', {
      headers: { 'Authorization': 'Bearer ' + session }
    });
    const data = await res.json();
    if (data.error) { window.location.href = '/login.html'; return; }
    currentUser = data;
    document.body.classList.add('role-' + data.role);
    loadTicket();
  } catch (err) { window.location.href = '/login.html'; }
}

async function loadTicket() {
  if (!ticketId) { window.location.href = '/tickets.html'; return; }

  try {
    const res = await fetch(API_BASE + '/api/tickets/get/' + ticketId, {
      headers: { 'Authorization': 'Bearer ' + localStorage.getItem('session') }
    });
    const data = await res.json();
    if (data.error) { alert(data.error); window.location.href = '/tickets.html'; return; }
    
    ticketData = data;
    renderTicket();
    renderMessages();
  } catch (err) {
    alert('Error cargando ticket');
    window.location.href = '/tickets.html';
  }
}

function renderTicket() {
  const t = ticketData;
  document.getElementById('headerTitle').textContent = 'Ticket ' + t.id;
  document.getElementById('ticketId').textContent = t.id;
  
  const statusEl = document.getElementById('ticketStatus');
  const statusText = { pending: 'Pendiente', scheduled: 'Agendado', in_progress: 'En Progreso', completed: 'Completado', rejected: 'Rechazado' };
  statusEl.textContent = statusText[t.status] || t.status;
  statusEl.className = 'ticket-status ' + t.status;
  
  document.getElementById('ticketUser').textContent = t.username;
  document.getElementById('ticketKit').textContent = t.kit;
  document.getElementById('ticketTier').textContent = t.targetTier;
  document.getElementById('ticketCreated').textContent = new Date(t.createdAt).toLocaleString('es-ES');
  document.getElementById('ticketTester').textContent = t.assignedTester || 'Sin asignar';

  if (t.scheduledDate && t.scheduledTime) {
    document.getElementById('scheduleBox').style.display = 'block';
    document.getElementById('scheduleTime').textContent = `${t.scheduledDate} a las ${t.scheduledTime}`;
  }

  if (t.result) {
    const box = document.getElementById('resultBox');
    box.style.display = 'block';
    box.className = 'result-box ' + t.result;
    document.getElementById('resultTitle').textContent = t.result === 'approved' ? '✓ Aprobado' : '✗ Rechazado';
    document.getElementById('resultText').textContent = t.result === 'approved' 
      ? `Nuevo tier: ${t.newTier}` 
      : 'El test no fue superado. Puedes volver a intentarlo más adelante.';
  }
}

function renderMessages() {
  const container = document.getElementById('chatMessages');
  if (!ticketData.messages || ticketData.messages.length === 0) {
    container.innerHTML = '<div class="chat-empty">Inicia la conversación...</div>';
    return;
  }

  container.innerHTML = '';
  ticketData.messages.forEach(m => {
    const div = document.createElement('div');
    const isMe = m.sender.toLowerCase() === currentUser.username.toLowerCase();
    div.className = 'message ' + (isMe ? 'user' : m.role);
    div.innerHTML = `
      <div class="message-sender">${m.sender} (${m.role})</div>
      <div class="message-text">${escapeHtml(m.message)}</div>
      <div class="message-time">${new Date(m.timestamp).toLocaleTimeString('es-ES', {hour:'2-digit',minute:'2-digit'})}</div>
    `;
    container.appendChild(div);
  });
  container.scrollTop = container.scrollHeight;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

async function sendMessage() {
  const input = document.getElementById('messageInput');
  const message = input.value.trim();
  if (!message) return;

  input.value = '';
  
  try {
    const res = await fetch(API_BASE + '/api/tickets/message', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + localStorage.getItem('session')
      },
      body: JSON.stringify({ ticketId, message })
    });
    
    if (res.ok) {
      loadTicket();
    }
  } catch (err) {}
}

async function assignTester() {
  const tester = document.getElementById('testerSelect').value;
  try {
    await fetch(API_BASE + '/api/admin/assign', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + localStorage.getItem('session')
      },
      body: JSON.stringify({ ticketId, tester })
    });
    loadTicket();
  } catch (err) {}
}

async function scheduleTest() {
  const date = document.getElementById('scheduleDate').value;
  const time = document.getElementById('scheduleTime').value;
  if (!date) { alert('Selecciona una fecha'); return; }
  
  try {
    await fetch(API_BASE + '/api/tickets/schedule', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + localStorage.getItem('session')
      },
      body: JSON.stringify({ ticketId, date, time })
    });
    loadTicket();
  } catch (err) {}
}

async function completeTicket(result) {
  const newTier = result === 'approved' ? document.getElementById('newTierSelect').value : null;
  
  try {
    await fetch(API_BASE + '/api/tickets/complete', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + localStorage.getItem('session')
      },
      body: JSON.stringify({ ticketId, result, newTier })
    });
    loadTicket();
  } catch (err) {}
}

// Enter to send
document.getElementById('messageInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// Auto-refresh
setInterval(loadTicket, 10000);

checkAuth();
</script>
</body>
</html>
