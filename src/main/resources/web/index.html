<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PvPTiers — Clasificación</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#080812;--bg1:#0f0f1e;--bg2:#14142a;--bg3:#1a1a35;
  --border:#2a2a50;--accent:#7c3aed;--accent2:#6d28d9;
  --gold:#f59e0b;--silver:#94a3b8;--bronze:#b45309;
  --text:#e2e8f0;--sub:#94a3b8;--dim:#4a5568;
  --ht1-c:#ef4444;--lt1-c:#f59e0b;--ht2-c:#a855f7;--lt2-c:#3b82f6;
  --ht3-c:#06b6d4;--lt3-c:#67e8f9;--ht4-c:#22c55e;--lt4-c:#86efac;
  --ht5-c:#f1f5f9;--lt5-c:#64748b;--unranked-c:#374151;
}
body{background:var(--bg0);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}

/* ── HEADER ── */
header{background:linear-gradient(135deg,var(--bg2) 0%,#1a0a3a 100%);border-bottom:1px solid var(--border);padding:0 2rem}
.nav-inner{max-width:1300px;margin:0 auto;display:flex;align-items:center;gap:2rem;height:64px}
.logo{font-size:1.6rem;font-weight:900;letter-spacing:-0.5px;background:linear-gradient(90deg,#7c3aed,#ec4899,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none}
.logo span{font-size:.9em}
.nav-links{display:flex;gap:1.5rem;margin-left:auto;align-items:center}
.nav-links a{color:var(--sub);text-decoration:none;font-size:.9rem;transition:color .2s}
.nav-links a:hover{color:var(--text)}
.search-wrap{position:relative}
.search-wrap input{background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:.45rem .9rem .45rem 2.2rem;font-size:.85rem;width:200px;transition:border .2s}
.search-wrap input::placeholder{color:var(--dim)}
.search-wrap input:focus{outline:none;border-color:var(--accent)}
.search-wrap::before{content:'⌕';position:absolute;left:.6rem;top:50%;transform:translateY(-50%);color:var(--dim);font-size:1rem;pointer-events:none}
.server-badge{display:flex;align-items:center;gap:.5rem;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:.35rem .8rem;font-size:.8rem}
.server-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── STATS BAR ── */
.stats-bar{background:var(--bg1);border-bottom:1px solid var(--border);padding:.6rem 2rem}
.stats-inner{max-width:1300px;margin:0 auto;display:flex;gap:2rem;align-items:center;flex-wrap:wrap}
.stat-item{display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:var(--sub)}
.stat-item strong{color:var(--text);font-size:.88rem}
.stat-sep{color:var(--border);user-select:none}

/* ── TABS ── */
.tabs-outer{background:var(--bg1);border-bottom:1px solid var(--border);padding:0 2rem}
.tabs{max-width:1300px;margin:0 auto;display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:.45rem;padding:.8rem 1.1rem;font-size:.84rem;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;transition:color .2s,border-color .2s;white-space:nowrap;user-select:none}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.tab-icon{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold}
.tab-overall .tab-icon{background:linear-gradient(135deg,var(--gold),#b45309)}

/* ── MAIN ── */
main{max-width:1300px;margin:2rem auto;padding:0 2rem}

/* ── TABLE ── */
.table-wrap{background:var(--bg1);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.table-header{display:grid;grid-template-columns:60px 2fr 100px 1fr 1fr;padding:.7rem 1.2rem;background:var(--bg2);border-bottom:1px solid var(--border);font-size:.72rem;color:var(--dim);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.row{display:grid;grid-template-columns:60px 2fr 100px 1fr 1fr;padding:.85rem 1.2rem;border-bottom:1px solid var(--border);align-items:center;transition:background .15s;cursor:default}
.row:last-child{border-bottom:none}
.row:hover{background:var(--bg2)}
.row.rank-1{background:linear-gradient(90deg,rgba(245,158,11,.08) 0%,transparent 60%)}
.row.rank-2{background:linear-gradient(90deg,rgba(148,163,184,.06) 0%,transparent 60%)}
.row.rank-3{background:linear-gradient(90deg,rgba(180,83,9,.06) 0%,transparent 60%)}

/* Rank number */
.rank-num{font-size:1.1rem;font-weight:800;text-align:center}
.rank-num.r1{color:var(--gold)}
.rank-num.r2{color:var(--silver)}
.rank-num.r3{color:var(--bronze)}

/* Player cell */
.player-cell{display:flex;align-items:center;gap:.8rem;min-width:0}
.avatar{width:38px;height:38px;border-radius:6px;background:var(--bg3);flex-shrink:0;image-rendering:pixelated}
.avatar-placeholder{width:38px;height:38px;border-radius:6px;background:linear-gradient(135deg,var(--bg3),var(--bg2));flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:.9rem;color:var(--sub)}
.player-info{min-width:0}
.player-name{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-title{font-size:.75rem;margin-top:2px;display:flex;align-items:center;gap:.3rem}
.title-badge{display:inline-flex;align-items:center;gap:.25rem;padding:.1rem .5rem;border-radius:20px;font-size:.7rem;font-weight:700;border:1px solid currentColor}

/* Region */
.region-cell{display:flex;justify-content:flex-start}
.region-badge{padding:.2rem .6rem;border-radius:5px;font-size:.75rem;font-weight:800;letter-spacing:.04em}
.region-eu{background:#1e3a5f;color:#60a5fa}
.region-na{background:#3b1f2b;color:#f87171}
.region-as{background:#1a3320;color:#4ade80}
.region-sa{background:#3b2a10;color:#fbbf24}
.region-oc{background:#1e2a40;color:#a78bfa}
.region-af{background:#2a1f1f;color:#fb923c}

/* Tier badges column */
.tiers-cell{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.tbadge{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;font-size:8.5px;font-weight:800;letter-spacing:-.3px;position:relative;flex-shrink:0}
.tbadge::after{content:attr(data-kit);position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--dim);white-space:nowrap;pointer-events:none}
.tiers-wrap{display:flex;flex-wrap:wrap;gap:3px;row-gap:18px;padding-bottom:4px}
.tbadge.ht1{background:linear-gradient(135deg,#ef4444,#7f1d1d);color:#fff;box-shadow:0 0 8px rgba(239,68,68,.5)}
.tbadge.lt1{background:linear-gradient(135deg,#f59e0b,#78350f);color:#fff}
.tbadge.ht2{background:linear-gradient(135deg,#a855f7,#581c87);color:#fff;box-shadow:0 0 6px rgba(168,85,247,.4)}
.tbadge.lt2{background:linear-gradient(135deg,#3b82f6,#1e3a8a);color:#fff}
.tbadge.ht3{background:linear-gradient(135deg,#06b6d4,#164e63);color:#fff}
.tbadge.lt3{background:linear-gradient(135deg,#67e8f9,#0e7490);color:#082f49}
.tbadge.ht4{background:linear-gradient(135deg,#22c55e,#14532d);color:#fff}
.tbadge.lt4{background:linear-gradient(135deg,#86efac,#166534);color:#052e16}
.tbadge.ht5{background:linear-gradient(135deg,#f1f5f9,#94a3b8);color:#0f172a}
.tbadge.lt5{background:linear-gradient(135deg,#475569,#1e293b);color:#cbd5e1}
.tbadge.sin-rango{background:var(--bg3);color:var(--dim);border:1px solid var(--border)}

/* Score */
.score-cell{font-size:.88rem;font-weight:700;color:var(--sub)}
.score-cell span{color:var(--text)}

/* ── EMPTY / LOADING ── */
.state-msg{padding:4rem 2rem;text-align:center;color:var(--dim)}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:1rem}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── TITLE COLORS ── */
.tc-leyenda{color:#ef4444;font-weight:800}
.tc-gran-maestro{color:#f59e0b;font-weight:800}
.tc-maestro{color:#f59e0b}
.tc-elite{color:#a855f7}
.tc-gladiador{color:#06b6d4}
.tc-campeon{color:#67e8f9}
.tc-guerrero{color:#22c55e}
.tc-veterano{color:#86efac}
.tc-luchador{color:#86efac}
.tc-soldado{color:#f1f5f9}
.tc-novato{color:#64748b}
.tc-sin-rango{color:#374151}

/* ── DETAIL MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:2rem;max-width:500px;width:90%;position:relative;transform:scale(.95);transition:transform .2s}
.modal-bg.open .modal{transform:scale(1)}
.modal-close{position:absolute;top:.8rem;right:.8rem;background:none;border:none;color:var(--sub);font-size:1.3rem;cursor:pointer;line-height:1}
.modal-close:hover{color:var(--text)}
.modal-player{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem}
.modal-avatar{width:56px;height:56px;border-radius:8px;image-rendering:pixelated}
.modal-name{font-size:1.3rem;font-weight:800}
.modal-title{font-size:.85rem;margin-top:.25rem}
.kit-list{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.kit-row{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:.6rem .8rem;display:flex;align-items:center;gap:.7rem}
.kit-label{font-size:.8rem;color:var(--sub);flex:1;text-transform:capitalize}
.kit-pts{font-size:.78rem;color:var(--dim)}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .table-header,.row{grid-template-columns:44px 1fr 70px}
  .score-cell,.tiers-cell{display:none}
  .search-wrap input{width:140px}
}
</style>
</head>
<body>

<header>
  <div class="nav-inner">
    <a class="logo" href="/">Pvp<span>Tiers</span></a>
    <nav class="nav-links">
      <a href="#">Clasificación</a>
      <a href="#">API</a>
    </nav>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Buscar jugador..."/>
    </div>
    <div class="server-badge">
      <span class="server-dot"></span>
      <span id="serverStatus">Cargando...</span>
    </div>
  </div>
</header>

<div class="stats-bar">
  <div class="stats-inner">
    <div class="stat-item"><span>Jugadores en línea:</span><strong id="statOnline">—</strong></div>
    <span class="stat-sep">·</span>
    <div class="stat-item"><span>Duelos activos:</span><strong id="statDuels">—</strong></div>
    <span class="stat-sep">·</span>
    <div class="stat-item"><span>En cola:</span><strong id="statQueue">—</strong></div>
    <span class="stat-sep">·</span>
    <div class="stat-item"><span>Región:</span><strong id="statRegion">—</strong></div>
  </div>
</div>

<div class="tabs-outer">
  <div class="tabs" id="tabsContainer">
    <div class="tab tab-overall active" data-kit="overall">
      <span class="tab-icon" style="background:linear-gradient(135deg,#f59e0b,#b45309)">★</span>
      General
    </div>
  </div>
</div>

<main>
  <div class="table-wrap">
    <div class="table-header">
      <div>#</div>
      <div>JUGADOR</div>
      <div>REGIÓN</div>
      <div>TIERS POR KIT</div>
      <div>PUNTOS</div>
    </div>
    <div id="tableBody">
      <div class="state-msg"><div class="spinner"></div><br/>Cargando clasificación...</div>
    </div>
  </div>
</main>

<!-- Modal de detalle -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-player">
      <img class="modal-avatar" id="modalAvatar" src="" alt=""/>
      <div>
        <div class="modal-name" id="modalName"></div>
        <div class="modal-title" id="modalTitle"></div>
      </div>
    </div>
    <div id="modalKits" class="kit-list"></div>
  </div>
</div>

<script>
const API = window.location.origin;
let allPlayers = [];
let currentKit = 'overall';
let kits = [];

const tierOrder = ['ht1','lt1','ht2','lt2','ht3','lt3','ht4','lt4','ht5','lt5','sin-rango'];
const tierColors = {
  'ht1':'#ef4444','lt1':'#f59e0b','ht2':'#a855f7','lt2':'#3b82f6',
  'ht3':'#06b6d4','lt3':'#67e8f9','ht4':'#22c55e','lt4':'#86efac',
  'ht5':'#f1f5f9','lt5':'#64748b','sin-rango':'#374151'
};

// ── Bootstrap ──────────────────────────────────────────────────────────
async function init() {
  await Promise.all([fetchStats(), fetchKits()]);
  await fetchTop('overall');
  setInterval(fetchStats, 15000);
}

async function fetchStats() {
  try {
    const r = await fetch(`${API}/api/stats`);
    const d = await r.json();
    document.getElementById('statOnline').textContent = d.online ?? '—';
    document.getElementById('statDuels').textContent  = d.duelos ?? '—';
    document.getElementById('statQueue').textContent  = d.en_cola ?? '—';
    document.getElementById('statRegion').textContent = d.region ?? '—';
    document.getElementById('serverStatus').textContent = `En línea · ${d.online} jugadores`;
  } catch {
    document.getElementById('serverStatus').textContent = 'Sin conexión';
    document.querySelector('.server-dot').style.background = '#ef4444';
  }
}

async function fetchKits() {
  try {
    kits = await (await fetch(`${API}/api/kits`)).json();
    buildTabs();
  } catch {}
}

async function fetchTop(kit) {
  currentKit = kit;
  document.getElementById('tableBody').innerHTML =
    '<div class="state-msg"><div class="spinner"></div><br/>Cargando...</div>';
  try {
    const url = kit === 'overall' ? `${API}/api/top` : `${API}/api/top/${encodeURIComponent(kit)}`;
    allPlayers = await (await fetch(url)).json();
    renderTable(allPlayers);
  } catch {
    document.getElementById('tableBody').innerHTML =
      '<div class="state-msg">Error al cargar datos. Reintenta en un momento.</div>';
  }
}

// ── Tabs ───────────────────────────────────────────────────────────────
function buildTabs() {
  const container = document.getElementById('tabsContainer');
  kits.forEach(k => {
    const tab = document.createElement('div');
    tab.className = 'tab';
    tab.dataset.kit = k;
    const icon = document.createElement('span');
    icon.className = 'tab-icon';
    icon.style.background = `linear-gradient(135deg,${tierColors['lt3']},${tierColors['ht3']})`;
    icon.textContent = k[0].toUpperCase();
    tab.appendChild(icon);
    tab.appendChild(document.createTextNode(' ' + capitalize(k)));
    tab.addEventListener('click', () => selectTab(k));
    container.appendChild(tab);
  });
}

function selectTab(kit) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.kit === kit));
  fetchTop(kit);
}

// ── Table render ────────────────────────────────────────────────────────
function renderTable(players) {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const filtered = search ? players.filter(p => p.nombre.toLowerCase().includes(search)) : players;

  if (!filtered.length) {
    document.getElementById('tableBody').innerHTML =
      '<div class="state-msg">No se encontraron jugadores.</div>';
    return;
  }

  document.getElementById('tableBody').innerHTML = filtered.map((p, i) => {
    const rank = i + 1;
    const rankClass = rank <= 3 ? `r${rank}` : '';
    const rowClass  = rank <= 3 ? `row rank-${rank}` : 'row';
    const region    = (p.region || 'EU').toLowerCase();
    const numStr    = rank <= 3
      ? `<div class="rank-num ${rankClass}">${rank}.</div>`
      : `<div class="rank-num" style="color:var(--dim)">${rank}.</div>`;

    const titleClass = slugify(p.titulo);
    const titleHtml  = `<span class="player-title"><span class="title-badge tc-${titleClass}" style="border-color:currentColor">${p.tituloSymbol || '◆'} ${p.titulo}</span></span>`;
    const avatarHtml = `<img class="avatar" src="https://crafatar.com/avatars/${p.uuid}?size=38&overlay" onerror="this.replaceWith(makeFallbackAvatar('${p.nombre}'))" alt="${p.nombre}"/>`;

    // Tier badges
    const tierBadges = buildTierBadges(p, currentKit);
    const displayPts = currentKit === 'overall' ? p.puntosTotales
      : (p.kits && p.kits[currentKit] ? p.kits[currentKit].puntos : 0);

    return `<div class="${rowClass}" data-uuid="${p.uuid}" onclick="openModal('${p.uuid}')">
      ${numStr}
      <div class="player-cell">
        ${avatarHtml}
        <div class="player-info">
          <div class="player-name">${escHtml(p.nombre)}</div>
          ${titleHtml}
        </div>
      </div>
      <div class="region-cell"><span class="region-badge region-${region}">${(p.region||'EU')}</span></div>
      <div class="tiers-cell"><div class="tiers-wrap">${tierBadges}</div></div>
      <div class="score-cell"><span>${displayPts}</span> pts</div>
    </div>`;
  }).join('');
}

function buildTierBadges(p, focusKit) {
  if (!p.kits) return '<span style="color:var(--dim);font-size:.8rem">—</span>';
  const entries = Object.entries(p.kits);
  if (!entries.length) return '<span style="color:var(--dim);font-size:.8rem">—</span>';
  return entries.map(([kit, info]) => {
    const cls = info.tier.toLowerCase().replace(' ', '-');
    const highlight = (focusKit === kit) ? 'outline:2px solid #fff;outline-offset:1px;' : '';
    return `<span class="tbadge ${cls}" data-kit="${kit}" title="${capitalize(kit)}: ${info.tier} (${info.puntos} pts)" style="${highlight}">${info.tier}</span>`;
  }).join('');
}

// ── Modal ───────────────────────────────────────────────────────────────
async function openModal(uuid) {
  try {
    const p = allPlayers.find(x => x.uuid === uuid);
    if (!p) return;
    document.getElementById('modalAvatar').src =
      `https://crafatar.com/avatars/${uuid}?size=56&overlay`;
    document.getElementById('modalName').textContent = p.nombre;
    const titleClass = slugify(p.titulo);
    document.getElementById('modalTitle').innerHTML =
      `<span class="tc-${titleClass}">${p.tituloSymbol} ${p.titulo}</span> · <span style="color:var(--sub)">${p.puntosTotales} pts totales</span>`;

    const kitsHtml = p.kits ? Object.entries(p.kits).map(([kit, info]) => {
      const cls = info.tier.toLowerCase().replace(' ','‑');
      return `<div class="kit-row">
        <span class="tbadge ${info.tier.toLowerCase().replace(' ','-')}" style="width:30px;height:30px;font-size:8px">${info.tier}</span>
        <span class="kit-label">${capitalize(kit)}</span>
        <span class="kit-pts">${info.puntos} pts</span>
      </div>`;
    }).join('') : '<div style="color:var(--dim);font-size:.85rem">Sin datos de kit.</div>';
    document.getElementById('modalKits').innerHTML = kitsHtml;
    document.getElementById('modalBg').classList.add('open');
  } catch {}
}

document.getElementById('modalClose').addEventListener('click', () =>
  document.getElementById('modalBg').classList.remove('open'));
document.getElementById('modalBg').addEventListener('click', e => {
  if (e.target === document.getElementById('modalBg'))
    document.getElementById('modalBg').classList.remove('open');
});

// ── Search ───────────────────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', () => renderTable(allPlayers));

// ── Helpers ───────────────────────────────────────────────────────────────
function capitalize(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }
function slugify(s)    { return (s||'').toLowerCase().replace(/\s+/g,'-').normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function escHtml(s)    { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function makeFallbackAvatar(name) {
  const el = document.createElement('div');
  el.className = 'avatar-placeholder';
  el.textContent = (name||'?')[0].toUpperCase();
  return el;
}

init();
</script>
</body>
</html>
