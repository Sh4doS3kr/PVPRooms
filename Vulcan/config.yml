    username: Detecciones (Survival)
    # Título del webhook
    title: Nueva Alerta de Vulcan
    # Descripción del webhook
    description: '**%player%** falló %check% (%type%) [%vl%/%max-vl%]'
    # El contenido enviará texto fuera del embed, así que puedes etiquetar roles o personas por ejemplo.
    content: ''
    information-field: false
    client-version-field: true
    client-brand-field: true
    server-name-field: false
    description-field: true
    location-field: false
    ping-tps-field: true
  punishments:
    # Mismas configuraciones y explicaciones que arriba
