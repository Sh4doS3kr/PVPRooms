settings:
  # Si las alertas se habilitarán automáticamente al unirse para jugadores con el permiso "vulcan.alerts"
  toggle-alerts-on-join: true
  # Si el placeholder de severidad debe basarse en violaciones por comprobación o en las violaciones totales del jugador
  per-check-severities: true
  # Si el modo cinematográfico será verificado para ciertas comprobaciones de puntería. No es gran cosa y puede dejarse desactivado
  # ya que esto casi NUNCA sucede a menos que se haga intencionalmente. Habilitarlo ralentizará las velocidades de detección.
  cinematic: false
  # Esto está aquí por si olvido quitar un mensaje de debug al publicar una actualización. Si olvido quitar un mensaje de debug
  # y ves [Vulcan Debug] en tu servidor, desactiva esto (no te afectará si está habilitado o deshabilitado a menos que olvide
  # quitar un mensaje de debug, pero si ves [Vulcan Debug] en el chat, configúralo en false y recarga).
  debug: true
  # Si el mensaje '¡Hay una nueva actualización disponible!' se mostrará al unirse para jugadores con permiso 'vulcan.admin'
  check-for-updates: true
  # Configuración para PacketEvents, podemos pedirte que cambies esto si tienes problemas con la inyección. Si todo funciona
  # bien, no lo toques.
  inject-early: true
  # Es el tiempo (en ticks - 20 ticks por segundo - valor por defecto es 80 (4 segundos)) de cuánto tiempo deben estar exentos
  # los jugadores de ciertas comprobaciones después de que se les aplique velocidad mediante otro plugin o algo (como Launchpads,
  # plugins de crates, etc.).
  max-velocity-ticks: 80
  # Es el tamaño máximo del archivo (en KB) antes de que violations.txt deba ser comprimido y puesto en la carpeta de logs
  max-logs-file-size: 7500
  # Si tienes una red bungee y quieres tener un nombre de servidor específico para mensajes de castigo/alerta, etc
  server-name: Default
  # Si los mensajes de alerta deben enviarse en el hilo principal o de forma asíncrona. Si tu servidor está en bungee, se recomienda
  # mantener esto desactivado ya que enviar grandes mensajes de componentes de chat con tanta información (hover, comandos de clic, etc.)
  # como los comandos de alerta pueden causar que a veces las personas sean expulsadas por 'El servidor en el que estabas se ha caído' o algo.
  # TLDR:
  # - Redes Bungeecord: dejar en FALSE
  # - Servidores individuales: configurarlo en TRUE para ahorrar rendimiento
  async-alerts: false
  # Si la API debe estar habilitada. Si quieres conectar con Vulcan y hacer algo sofisticado, entonces habilítalo, sin embargo
  # la mayoría de la gente nunca usará esto y deshabilitarlo permite menos runnables y más rendimiento ya que los eventos no
  # necesitan ser llamados en absoluto (también están obligados a ser llamados sincronizados, así que es una ganancia de rendimiento
  # ganancia-ganancia)
  enable-api: false
  # Si el verificador de actualizaciones debe estar habilitado
  update-checker: true
  # El retraso en milisegundos (1000ms = 1 segundo)
  punishment-delay: 15000
  # Si Vulcan debe ignorar automáticamente a jugadores de Bedrock usando la API de Floodgate.
  ignore-floodgate: true
  # Esto es altamente altamente recomendado mantener en false ya que puede ser falsificado por el cliente, sin embargo, si estás
  # usando Geyser y por alguna razón no puedes hacer que Floodgate funcione, entonces habilítalo. Si tienes floodgate-bukkit en
  # tu servidor y Geyser funciona bien, entonces no lo toques.
  ignore-flags-geyser-client-brand: false
  # Cuánto tiempo debemos esperar para que todo se inicialice antes de que los jugadores comiencen a ser verificados (en milisegundos).
  # El valor por defecto es 2500ms.
  join-check-wait-time: 2500
  # Si los jugadores con UUID que comienzan con '000000' deben ser ignorados y no Checkdos - usado para exenciones de
  # jugadores de Geyser si todo lo demás falla.
  ignore-geyser-uuids: true
  # Si debemos ignorar Checks para jugadores cuyos nombres de usuario comienzan con un cierto carácter/cadena de caracteres
  ignore-geyser-prefixes: true
  # La cadena a ser ignorada - todos los nombres de jugadores que comiencen con * no serán Checkdos (sensible a mayúsculas si no son símbolos)
  ignore-geyser-prefix: '*'
  # La violación máxima (violaciones por encima de esta no serán enviadas)
  max-alert-violation: 250
  # Cuánto tiempo deben estar exentos las personas de las comprobaciones cuando estaban en /fly (por defecto = 40 ticks, 2 segundos)
  flight-cooldown: 60
  # Lo que el comando /vulcan top debe mostrar si no hay suficientes usuarios para ordenar
  top-command-unresolved: Sin Resolver
  # Si los jugadores que están en la cola del día del juicio deben poder ser baneados de nuevo.
  ignore-if-in-judgement-day: false
  # Si los jugadores que se unen con Vivecraft deben ser ignorados. Ten cuidado con esto ya que puede ser falsificado.
  ignore-vivecraft: false
  # Los andamios son bloques realmente rotos, si debemos ser más indulgentes con ellos para ciertas comprobaciones.
  lenient-scaffolding: true
  # Si bStats debe cargarse
  bstats: true
  # Si Vulcan debe tener en cuenta las colisiones de entidades
  entity-collision: true
  # Si Vulcan debe conectarse con mcMMO si está disponible.
  hook-mcmmo: true
  # Si Vulcan debe conectarse con MythicMobs si está disponible.
  hook-mythicmobs: true
  # Si Vulcan debe conectarse con GSit si está disponible
  hook-gsit: true
  # Si Vulcan debe conectarse con Brewery si está disponible
  hook-brewery: true
  # Si Vulcan debe ignorar alertas para violaciones que son mayores que el umbral de violaciones máximas
  ignore-alerts-over-max-violations: false
  # La cantidad mayor que las violaciones máximas que deben ser ignoradas (ejemplo, 3 significaría que si las violaciones máximas
  # estaban configuradas en 10, las alertas mayores a VL 13 serían ignoradas)
  ignore-alerts-over-max-violations-amount: 3
  # Si Vulcan debe advertirte si es posible que estés usando un fork de spigot incompatible.
  incompatability-manager: true
  # Si Vulcan debe enviar mensajes de plugin
  plugin-messaging: true
  # Si Vulcan debe retrotraer a los jugadores cuando están más bajos que su última posición enGround (esto puede llevar a
  # cosas como anti-voids, por lo que no se recomienda particularmente si tienes algo como un servidor SkyWars/BedWars)
  dont-setback-lower-positions: false
  # Ticks mínimos de existencia antes de que un jugador sea verificado, similar a join-check-wait-time arriba
  min-ticks-existed: 3
  # Si debemos calcular la distancia entre el jugador y WorldBorder para prevenir falsas Checks en las
  # comprobaciones de Velocidad. Solo necesario en servidores muy específicos.
  velocity-world-border: false
  # Si Vulcan debe tener en cuenta tener 10 kabillion entidades en un lugar que te lanza muy rápido y podría
  # 'falsificar' algunas comprobaciones. No importará en el 99% de los servidores
  entity-cram-fix-enabled: true
  # La cantidad de entidades que deben ser tenidas en cuenta
  entity-cram-entities-amount: 10
  # Cuánto tiempo deben estar exentas las comprobaciones si se encuentran las entidades de arriba
  entity-cram-exempt-ticks: 30
  # Soporte para modificadores de atributos
  handle-attributes: true
discord-webhook:
  # Si el cooldown está habilitado
  cooldown: false
  # Con qué frecuencia debe reiniciarse el contador en ticks (por defecto = 12000 ticks o 10 mins, 20 ticks = 1 segundo)
  cooldown-reset-ticks: 12000
  # Máximos webhooks permitidos en el período de tiempo anterior
  cooldown-max-webhooks: 100
  # La sección para las alertas de Discord Webhook
  alerts:
    # Si las Alertas de Discord Webhook deben estar habilitadas
    enabled: true
    # Pega la URL a tu webhook aquí. Para cómo crear un webhook, por favor ve https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks
    url: https://discord.com/api/webhooks/1376644499522060328/tuAhYI2JwGAcwWIim5YP1ncC-JDafKXmTh_jeumH4X2D4Dvgr60e3kk0Oh77zb_68r4g
