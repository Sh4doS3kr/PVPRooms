prefix: '#ff7109&lᴍᴏᴏɴɢᴜᴀʀᴅ &8»'
alerts:
  format: '%prefix% &e%player% &festá usando &e%check%&f (&e%complex-type%&f) &8[#ff7109%vl%
    &8| #ff7109%ping%ms&8]'
  hover-message:
  - '#DBD9D9• &fJugador: &e%player%'
  - '#DBD9D9• &fCheck: &e%client-brand% #DBD9D9(%version%)'
  - '#DBD9D9• &fComprobación: &e%check% #DBD9D9(Tipo &f%type%#DBD9D9)'
  - '#DBD9D9• &fViolaciones: &e%vl% #DBD9D9/ &e%max-vl%'
  - '#DBD9D9• &fPing: &e%ping%ms'
  - '#DBD9D9• &fTPS: &e%tps%'
  - ''
  - '#DBD9D9Info: %description%'
  - ''
  - '#DBD9D9• &fHaz clic para teletransportarte a &e%player%'
  click-commands:
  - /tp %player%
  click-alert-command-commands:
  - tp %player%
  toggled-on-message: '%prefix% &fLas alertas han sido &aactivadas.'
  toggled-off-message: '%prefix% &fLas alertas han sido &cdesactivadas&f.'
  print-to-console: true
  console-format: '[Vulcan] %player% activó %check% %dev%(Tipo %type%)%dev% (%vl%/%max-vl%)'
  custom-commands: []
  severity:
    violations:
      '2': 2
      '3': 4
      '4': 6
      '5': 8
      '6': 10
      '7': 12
      '8': 14
      '9': 16
      '10': 18
    colors:
      '1': '&a'
      '2': '&e'
      '3': '&e'
      '4': '&6'
      '5': '&6'
      '6': '&c'
      '7': '&c'
      '8': '&4'
      '9': '&4'
      '10': '&4'
  experimental-symbol: ✦
verbose:
  format: '%prefix% &f%player% &7verbosed &f%check% &7(&f%type%&7) %dev% &7[&4%percent%%&7]'
  hover-message:
  - '&7Ping: &c%ping% &8| &7TPS: &c%tps% &8| &7Version: &c%version%'
  - ''
  - '&7Description:'
  - '&7%description%'
  - ''
  - '&7Buffer:'
  - '&7%buffer%/%max-buffer%'
  - ''
  - '&7Click to teleport to &b%player%&7.'
  click-commands:
  - /tp %player%
  toggled-on-message: '%prefix% &7Vulcan verbose &aenabled&7!'
  toggled-off-message: '%prefix% &7Vulcan verbose &cdisabled&7!'
log-file:
  enabled: true
  alert-message: '&e%player% &fha fallado &e%check% (%type%) #DBD9D9| #ff7109x%vl%
    #DBD9D9%ping%ms TPS: %tps% Version: %version% Client: %client-brand%]'
  punishment-message: '&e%player% &frecibió un castigo por &e%check% (%type%) #DBD9D9|
    #ff7109x%vl% #DBD9D9%ping%ms TPS: %tps% Cliente: %client-brand%'
unloaded-chunks:
  setback-enabled: true
  message: '%prefix% &f%player% #DBD9D9fue retrotraído por estar en un trozo descargado!'
  max-ticks: 40
punishment-file:
  enabled: true
violation-reset:
  enabled: true
  interval-in-minutes: 5
  message-enabled: false
  message: '%prefix% &6¡Las violaciones de todos los jugadores en línea han sido reiniciadas!'
client-brand-alerts:
  resolve: true
  enabled: true
  ignore-alerts-list:
  - vanilla
  message: '%prefix% &f%player% #DBD9D9se unió usando &f%client-brand%'
  blocked-client-brands: []
  unallowed-client-brand-kick-message: '&c¡No puedes unirte con %client-brand%!'
  console: false
  console-message: '[Vulcan] %player% se unió usando %client-brand%!'
  whitelist-enabled: false
  whitelisted-client-brands: []
connection:
  desync:
    kick-enabled: false
    max-ticks: 600
    kick-message: 'Internal Exception: io.netty.handler.timeout.ReadTimeoutException'
    staff-alert-message: '%prefix% &c%player% &7was kicked for being out of sync with
      the server! &7(&c%ticks% &7ticks)'
    console-message: '[Vulcan] &c%player% &7was kicked for being out of sync with
      the server! &7(&c%ticks% &7ticks)'
  transaction:
    kick-enabled: false
    max-delay: 60000
    kick-message: 'Internal Exception: io.netty.handler.timeout.ReadTimeoutException'
    staff-alert-message: '%prefix% &c%player% &7was kicked for not replying to Transaction
      Packets! &7(&c%delay%ms&7)'
    console-message: '[Vulcan] &c%player% &7was kicked for not replying to Transaction
      Packets! &7(&c%delay%ms&7)'
  keepalive:
    kick-enabled: false
    max-delay: 60000
    kick-message: '&cConexión perdida: No hay respuesta a la señal de keepalive.'
    staff-alert-message: '%prefix% &e%player% #DBD9D9no respondió a los paquetes keepalive
      dentro de &c%delay%ms#DBD9D9.'
    console-message: '[Vulcan] &e%player% no respondió a los paquetes keepalive en
      &c%delay%ms.'
  max-ping:
    kick-enabled: false
    max-ping: 10000
    max-ticks: 20
    kick-message: '&cConexión perdida: Tu ping excedió el límite permitido.'
    staff-alert-message: '%prefix% &e%player% #DBD9D9fue expulsado por ping excesivo
      (&c%ping%ms#DBD9D9).'
    console-message: '[Vulcan] &e%player% fue desconectado por tener ping muy alto:
      &c%ping%ms.'
punishments:
  message: '%prefix% &e%player% &f fue removido de la red debido a &e%check% (%type%)
    #DBD9D9| #ff7109x%vl%'
  broadcast:
  - '&6× &f%player% #DBD9D9fue removido por &cVentajas Injustas#DBD9D9.'
judgement-days:
  started-broadcast:
  - '&6&m---»--*-------------------------------------*--«---'
  - '&cVulcan Día del Juicio v1 ha comenzado...'
  - '&6&m---»--*-------------------------------------*--«---'
  ended-broadcast:
  - '&6&m---»--*-------------------------------------*--«---'
  - '&cDía del Juicio terminado... #ff7109%amount% jugadores castigados.'
  - '&6&m---»--*-------------------------------------*--«---'
  commands:
  - ban %player% &c[Vulcan] Día del Juicio v1
  broadcast:
  - '&6&m---»--*-------------------------------------*--«---'
  - '&e%player% &6fue baneado por &c[Vulcan] Día del Juicio v1&6.'
  - '&6&m---»--*-------------------------------------*--«---'
  cooldown: 1000
  run-at-interval: false
  interval: 36000
freeze:
  logged-out-while-frozen-commands: []
ghost-blocks-fix:
  enabled: true
  ghost-water-fix: true
  minimum-tps: 18.5
  ignore-legacy-via: true
  buffer:
    max: 3
    decay: 0.1
  setback: true
  update-blocks: true
  ticks: 3
  message-enabled: true
  message: '&cEstabas parado en un bloque fantasma. ¡Tu posición ha sido corregida!'
  staff-message-enabled: true
  staff-message: '%prefix% &fLa #DBD9D9posición de %player% fue corregida por bloques
    fantasmas en &e(&c%world%, %x%, %y%, %z%&e) &6[%ticks% ticks]'
  print-to-console: true
  console-message: '[Vulcan] Posición de %player% corregida por bloque fantasma en
    (%world%, %x%, %y%, %z%) &6[%ticks% ticks]'
