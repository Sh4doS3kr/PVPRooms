    url: https://discord.com/api/webhooks/1376644499522060328/tuAhYI2JwGAcwWIim5YP1ncC-JDafKXmTh_jeumH4X2D4Dvgr60e3kk0Oh77zb_68r4g
    avatar: http://cravatar.eu/avatar/%name%/64.png
    thumbnail: http://cravatar.eu/avatar/%name%/64.png
